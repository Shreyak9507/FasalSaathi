<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bagBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f1"/>
    </linearGradient>
    <linearGradient id="headerGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bag Shape -->
  <path d="M 35 30 L 165 30 L 175 220 C 175 228, 168 232, 160 232 L 40 232 C 32 232, 25 228, 25 220 Z" 
        fill="url(#bagBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Bag Top Stitching -->
  <line x1="30" y1="36" x2="170" y2="36" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="32" y1="42" x2="168" y2="42" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Green Header Stripe -->
  <path d="M 33 46 L 167 46 L 169 76 L 31 76 Z" fill="url(#headerGreen)"/>
  <text x="100" y="66" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">NEEM COATED</text>

  <!-- Big UREA Title -->
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="28" font-weight="950" fill="#0f172a" text-anchor="middle">UREA</text>
  
  <!-- Leaf Icon Center -->
  <g transform="translate(85, 125)">
    <path d="M 15 0 C 30 10, 30 25, 15 30 C 0 25, 0 10, 15 0 Z" fill="#22c55e"/>
    <path d="M 15 0 L 15 30" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <!-- Nutrient Highlight -->
  <rect x="45" y="165" width="110" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="100" y="184" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">NITROGEN (N) 46%</text>

  <!-- Pack Weight Banner -->
  <rect x="55" y="202" width="90" height="20" rx="4" fill="#e2e8f0"/>
  <text x="100" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">NET WT. 45 KG</text>
</svg>
