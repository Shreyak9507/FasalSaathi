<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="npkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bag Shape -->
  <path d="M 35 30 L 165 30 L 175 220 C 175 228, 168 232, 160 232 L 40 232 C 32 232, 25 228, 25 220 Z" 
        fill="url(#npkBg)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Stitching -->
  <line x1="30" y1="36" x2="170" y2="36" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="32" y1="42" x2="168" y2="42" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Header Stripe -->
  <path d="M 33 46 L 167 46 L 169 76 L 31 76 Z" fill="url(#headerBlue)"/>
  <text x="100" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BALANCED COMPLEX</text>

  <!-- Big NPK Title -->
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="28" font-weight="950" fill="#1e3a8a" text-anchor="middle">NPK</text>
  
  <text x="100" y="138" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">COMPLETE PLANT NUTRITION</text>

  <!-- Nutrient Highlight -->
  <rect x="36" y="160" width="128" height="32" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="100" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="850" fill="#1e40af" text-anchor="middle">N - P₂O₅ - K₂O</text>

  <!-- Pack Weight Banner -->
  <rect x="55" y="202" width="90" height="20" rx="4" fill="#bfdbfe"/>
  <text x="100" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">NET WT. 50 KG</text>
</svg>
