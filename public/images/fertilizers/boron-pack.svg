<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boronBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="headerCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Pouch Shape -->
  <path d="M 45 35 L 155 35 L 165 215 C 165 224, 158 228, 150 228 L 50 228 C 42 228, 35 224, 35 215 Z" 
        fill="url(#boronBg)" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Heat Seal Notch -->
  <line x1="40" y1="42" x2="160" y2="42" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Header Stripe -->
  <path d="M 43 50 L 157 50 L 158 78 L 42 78 Z" fill="url(#headerCyan)"/>
  <text x="100" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MICRONUTRIENT</text>

  <!-- Title -->
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="24" font-weight="950" fill="#155e75" text-anchor="middle">BORAX</text>
  <text x="100" y="136" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0891b2" text-anchor="middle">FLOWERING & POD SET</text>

  <!-- Formula Highlight -->
  <rect x="45" y="152" width="110" height="32" rx="6" fill="#ffffff" stroke="#67e8f9" stroke-width="1.2"/>
  <text x="100" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="850" fill="#164e63" text-anchor="middle">BORON (B) 10.5%</text>

  <!-- Pack Weight Banner -->
  <rect x="58" y="196" width="84" height="20" rx="4" fill="#a5f3fc"/>
  <text x="100" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="750" fill="#155e75" text-anchor="middle">1 KG PACK</text>
</svg>
