<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="fymBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#f5f5f4"/>
    </linearGradient>
    <linearGradient id="headerBrown" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bag Shape (Jute style) -->
  <path d="M 35 30 L 165 30 L 175 220 C 175 228, 168 232, 160 232 L 40 232 C 32 232, 25 228, 25 220 Z" 
        fill="url(#fymBg)" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Stitching -->
  <line x1="30" y1="36" x2="170" y2="36" stroke="#78350f" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="32" y1="42" x2="168" y2="42" stroke="#78350f" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Header Stripe -->
  <path d="M 33 46 L 167 46 L 169 76 L 31 76 Z" fill="url(#headerBrown)"/>
  <text x="100" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ORGANIC AMENDMENT</text>

  <!-- Title -->
  <text x="100" y="112" font-family="system-ui, sans-serif" font-size="20" font-weight="950" fill="#451a03" text-anchor="middle">FARMYARD</text>
  <text x="100" y="132" font-family="system-ui, sans-serif" font-size="20" font-weight="950" fill="#78350f" text-anchor="middle">MANURE</text>

  <!-- Plant Sprout Icon -->
  <g transform="translate(88, 142)">
    <circle cx="12" cy="12" r="10" fill="#dcfce7"/>
    <path d="M 12 18 L 12 8 M 12 11 C 9 9, 7 11, 8 13 C 9 14, 11 13, 12 11 M 12 9 C 15 7, 17 9, 16 11 C 15 12, 13 11, 12 9" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Highlight -->
  <rect x="36" y="168" width="128" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="850" fill="#78350f" text-anchor="middle">ORGANIC CARBON >12%</text>

  <!-- Pack Weight Banner -->
  <rect x="55" y="202" width="90" height="20" rx="4" fill="#e7e5e4"/>
  <text x="100" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#44403c" text-anchor="middle">50 KG / BULK</text>
</svg>
